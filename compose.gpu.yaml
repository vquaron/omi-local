# Linux x86_64 / WSL2 with a working NVIDIA Container Toolkit.
services:
  stt:
    platform: linux/amd64
    build:
      target: cuda
    environment:
      STT_DEVICE: cuda
      STT_COMPUTE_TYPE: float16
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${OMI_DOCKER_GPU_ID:-0}']
              capabilities: [gpu]

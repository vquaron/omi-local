name: Local checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  transport-unit:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated test dependencies
        run: python -m pip install -r .github/requirements-transport.txt
      - name: Install supported Docker Compose
        if: runner.os == 'Linux'
        uses: docker/setup-compose-action@v1
        with:
          version: v2.40.3
      - name: Validate Docker configuration
        if: runner.os == 'Linux'
        run: docker compose -f compose.yaml -f compose.gpu.yaml -f compose.dev.yaml config --quiet
      - run: make test-transport-unit PYTHON="$(command -v python)"
  transport-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: app/pubspec.yaml
          channel: stable
          cache: true
      - run: make test-transport-app
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download and verify Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          release=https://github.com/gitleaks/gitleaks/releases/download/v8.24.2
          archive=gitleaks_8.24.2_linux_x64.tar.gz
          curl --fail --silent --show-error --location "$release/$archive" -o "$archive"
          curl --fail --silent --show-error --location "$release/gitleaks_8.24.2_checksums.txt" -o checksums.txt
          awk -v name="$archive" '$2 == name { print }' checksums.txt > selected-checksum.txt
          test -s selected-checksum.txt
          sha256sum -c selected-checksum.txt
          tar -xzf "$archive" gitleaks
      - name: Verify synthetic fixture exception boundaries
        run: python3 scripts/test-secret-scan.py "$RUNNER_TEMP/gitleaks"
      - name: Scan files and history
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/gitleaks" dir . --redact=100 --ignore-gitleaks-allow --max-decode-depth 2
          "$RUNNER_TEMP/gitleaks" git . --redact=100 --ignore-gitleaks-allow --max-decode-depth 2

# Standalone WhisperLiveKit live-STT server for the omiloc "external" Live provider.
# Runs beside (not inside) the omiloc stack on an NVIDIA host. Setup:
#   git clone --branch v0.2.26 --recurse-submodules https://github.com/QuentinFuxa/WhisperLiveKit.git
#   cp env.example .env  (WLK_BIND_ADDRESS = the host Tailscale IPv4)
#   docker compose up -d --build
# omiloc: Settings → Live STT → external → ws://<WLK_BIND_ADDRESS>:<WLK_PORT>/asr
# --pcm-input is required: omiloc streams raw PCM16 mono 16 kHz and expects useAudioWorklet.
name: sky-livekit
services:
  wlk:
    build:
      context: ./WhisperLiveKit
      args:
        EXTRAS: cu129
    image: sky-whisperlivekit:0.2.26
    pull_policy: never
    command:
      - --model
      - ${WLK_MODEL:-large-v3-turbo}
      - --backend
      - faster-whisper
      - --language
      - ${WLK_LANGUAGE:-ru}
      - --pcm-input
      - --port
      - '8000'
    init: true
    ports:
      - '${WLK_BIND_ADDRESS:-127.0.0.1}:${WLK_PORT:-8010}:8000'
    volumes:
      - wlk-cache:/root/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
volumes:
  wlk-cache:

pid /tmp/nginx.pid;
events {}
http {
  access_log off;
  error_log /dev/stderr crit;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  server {
    listen 22000;
    location / {
      proxy_pass http://127.0.0.1:21000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $http_host;
      # Mark every proxied API request, including normalized/aliased preview paths.
      # Uvicorn ignores proxy headers; the local preview guard rejects their presence.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Host "";
      proxy_set_header X-Forwarded-Proto "";
      proxy_read_timeout 86400s;
      client_max_body_size 256m;
    }
    # The paired backend owns its public route allowlist; never expose previews.
    location = /v1/local/preview { return 403; }
  }
  server {
    listen 22001;
    location / {
      proxy_pass http://127.0.0.1:21001;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_read_timeout 3600s;
      # Preserve Origin and Host so the existing same-origin checks remain effective.
    }
  }
}
